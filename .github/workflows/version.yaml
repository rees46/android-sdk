name: Bump version

on:
  push:
    branches:
      - master
    paths-ignore:
      - .github
  workflow_dispatch:

jobs:
  find-release-commit:
    uses: rees46/workflow/.github/workflows/reusable-release-commit-finder.yaml@master
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}

  bump-version:
    needs: find-release-commit
    # Only the canonical repository (matched by owner id, which synchronization leaves as it is)
    # numbers releases. A synchronized copy publishes the version synchronization brings it, so
    # both carry the same number.
    if: |
      github.repository_owner_id == '6458050' && (
        github.event_name == 'workflow_dispatch' || (
          github.event_name == 'push' &&
          needs.find-release-commit.outputs.hasCommit == 'false'))
    uses: rees46/workflow/.github/workflows/reusable-multiplatform-version-bump.yaml@master
    permissions: write-all
    secrets:
      appSecret: ${{ secrets.VERSIONER_SECRET }}
      githubToken: ${{ secrets.GITHUB_TOKEN }}
    with:
      appId: ${{ vars.VERSIONER_ID }}
      reviewerUsername: ${{ vars.REVIEWER_USERNAME }}
