{
  branches: ['master'],
  plugins:
    [
      [
        '@semantic-release/commit-analyzer',
        {
          # The merged release PR's commit, feat(release): version, records a version already cut;
          # counted as a feature it would make the next push to master cut a minor of its own.
          # Every other commit falls through to the default rules.
          'releaseRules': [{ 'type': 'feat', 'scope': 'release', 'release': false }],
        },
      ],
      '@semantic-release/release-notes-generator',
      [
        '@semantic-release/github',
        {
          'assets': 'source.tgz',
          'successComment': false,
          'releasedLabels': false,
        },
      ],
      [
        '@semantic-release/git',
        {
          'assets': ['version.properties'],
          'message': "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}",
        },
      ],
      [
        '@semantic-release/exec',
        {
          'prepareCmd': 'chmod +x ./scripts/update_version.sh && ./scripts/update_version.sh ${nextRelease.version} && tar --exclude=source.tgz -czvf source.tgz *',
        },
      ],
    ],
}
