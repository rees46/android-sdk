# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx8g
org.gradle.configureondemand=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# Lint of AGP 8.5 reads Kotlin metadata up to 2.1; OkHttp 5 brings kotlin-stdlib 2.2, and without a newer
# lint every Kotlin `forEach` would be reported as the Java 8 one (NewApi). Lint 8.9 reads 2.2.
android.experimental.lint.version=8.9.1
