plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'maven-publish'
    id 'signing'
    id 'kotlin-kapt'
}

android {
    compileSdkVersion 34
    flavorDimensions += 'default'
    viewBinding {
        enabled = true
    }
    dataBinding {
        enabled = true
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    testOptions {
        unitTests {
            // Robolectric читает смерженные ресурсы модуля: без этого тесты
            // дизайн-системы падают на Resources$NotFoundException.
            includeAndroidResources = true
        }
    }
    defaultConfig {
        // Android 6.0: what current Firebase Messaging and media3 need (decision 0003).
        minSdkVersion 23
        targetSdkVersion 34
        buildConfigField "String", "VERSION_NAME", "\"" + version + "\""
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Shipped to the consumer's R8 so a FCM-only app (without the optional HMS artifacts) does
        // not fail on the absent Huawei classes referenced by HmsMessagingService/HmsTokenSource.
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // v3 (попапы нового конструктора, сторис на API v3) не публичный API и закрыт маркером
        // opt-in; библиотека использует его сама.
        freeCompilerArgs += ['-opt-in=com.personalization.InternalPersonalizationV3Api']
        // Interface methods with a body become Java default methods, so a Java implementation of a
        // public interface does not break when a method with a default body is added to it.
        // "compatibility" keeps the DefaultImpls classes that Kotlin code compiled earlier calls.
        freeCompilerArgs += ['-Xjvm-default=all-compatibility']
    }

    sourceSets {
        main {
            main.java.srcDirs = ['src/main/kotlin']
        }
    }

    productFlavors {
        rees46 {
            dimension 'default'
            ext.set("group", "com.rees46")
            ext.set("libraryName", "com.rees46.sdk")
            ext.set("webSite", "https://rees46.com")
            ext.set("vcsUrl", "https://github.com/rees46/android-sdk")
        }
        personaclick {
            dimension 'default'
            ext.set("group", "com.personaclick")
            ext.set("libraryName", "com.personaclick.sdk")
            ext.set("webSite", "https://personaclick.com")
            ext.set("vcsUrl", "https://github.com/PersonaClick/android-sdk")
        }
    }

    testFixtures {
        enable = false
    }

    namespace 'com.personalization'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Explicitly exclude demo-app from SDK dependencies
    // demo-app is a separate application module and should not be included in SDK artifacts
    configurations.all {
        exclude group: 'com.personalization.demo', module: 'demo-app'
    }

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains:annotations:24.1.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    // Starts following the activity on screen when the process starts, before any activity exists,
    // so popups can find one however late the host initializes the SDK. Already on the classpath
    // through lifecycle-process; declared because the SDK now relies on it directly.
    implementation 'androidx.startup:startup-runtime:1.1.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    // The new core's HTTP client (Rees46Config.coreV2): one connection pool for the process. 5.3 is the
    // last line that compiles against any compileSdk: 5.4 asks apps for compileSdk 36, 5.5 for 37. Its
    // kotlin-stdlib 2.2 is why apps and this SDK need a Kotlin compiler of 2.1 or later.
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'

    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    // Huawei push is OPTIONAL. compileOnly keeps HMS off every consumer's classpath (and out of
    // the published POM), so a plain FCM app builds without the Huawei Maven repo. To enable
    // Huawei push, the host app adds these as `implementation`, applies the `com.huawei.agconnect`
    // plugin and ships `agconnect-services.json`. Presence is detected at runtime — see
    // PushTokenManager — and R8 warnings for the absent classes are suppressed via consumer-rules.pro.
    compileOnly 'com.huawei.hms:push:6.11.0.300'
    compileOnly 'com.huawei.agconnect:agconnect-core:1.9.1.301'

    // Jetpack Compose is OPTIONAL and only backs StoriesWidget, the wrapper around StoriesView.
    // compileOnly mirrors the Huawei setup above: Compose stays off every consumer's classpath and
    // out of the published POM, so a View-based app pulls none of it. A host that wants the wrapper
    // already has Compose and declares it as `implementation` itself. compileOnly artifacts take no
    // part in manifest merging either.
    compileOnly platform('androidx.compose:compose-bom:2024.06.00')
    compileOnly 'androidx.compose.ui:ui'
    compileOnly 'androidx.compose.foundation:foundation'
    compileOnly 'androidx.compose.runtime:runtime'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'com.google.dagger:dagger:2.57.2'

    // Instrumented tests only: as `implementation` they reached every host app's release build.
    androidTestImplementation("androidx.test:core:1.6.1")
    androidTestImplementation("androidx.test:rules:1.6.1")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")

    implementation("com.google.android.gms:play-services-ads-identifier:17.0.0")

    kapt 'com.google.dagger:dagger-compiler:2.57.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.11'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.4'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.12.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.3.2'
    // compileOnly dependencies are absent from the unit test classpath, and the Compose compiler
    // plugin refuses to compile the test variant without the runtime it can see. These mirror the
    // compileOnly declarations above and stay confined to tests, so the published POM is unaffected.
    testImplementation platform('androidx.compose:compose-bom:2024.06.00')
    testImplementation 'androidx.compose.runtime:runtime'
}

configurations {
    rees46Debug
    rees46Release
    personaclickDebug
    personaclickRelease
}

group = 'com.personalization'

apply from: '../publish.gradle'

tasks.register('sourcesJar', Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}

tasks.register('javadoc', Javadoc) {
    // Javadoc tool cannot process .kt files — only include generated .java stubs
    source = fileTree(dir: 'src/main/kotlin', include: '**/*.java')
    classpath += files("${android.sdkDirectory}/platforms/${android.compileSdkVersion}/android.jar")
    failOnError false
    options.encoding = 'UTF-8'
    options.charSet('UTF-8')
    options.links("http://docs.oracle.com/javase/7/docs/api/")
    options.links("http://d.android.com/reference/")
    destinationDir = file("${buildDir}/docs/javadoc")
}

tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    archiveClassifier.set('javadoc')
    from javadoc.destinationDir
}

tasks.register('printVersionName') {
    doLast {
        println version
    }
}

tasks.register('increaseVersionCode') {
    doLast {
        def (major, minor, patch) = version.tokenize('.')
        major = major.toInteger()
        minor = minor.toInteger()
        patch = patch.toInteger()

        Integer newPatch = patch + 1

        String result = "$major.$minor.$newPatch"

        String s = buildFile.getText().replaceFirst("version='$version'", "version='$result'")

        buildFile.setText(s)
    }
}

artifacts {
    archives javadocJar
    archives sourcesJar
}

afterEvaluate {
    tasks.javadoc.classpath += files(android.libraryVariants.collect { variant ->
        variant.javaCompileProvider.get().classpath
    })
}

tasks.register("printVariants") {
    doLast {
        android.libraryVariants.forEach { variant ->
            println("Variant: ${variant.flavorName}Sonatype")
        }
    }
}

// Custom publishing tasks for independent repository publishing
tasks.register('publishToGitHubPackages') {
    group = 'publishing'
    description = 'Publish to GitHub Packages only'
    dependsOn 'publish'
    doFirst {
        println "Publishing to GitHub Packages only"
    }
}

tasks.register('publishToMavenCentral') {
    group = 'publishing'
    description = 'Publish to Maven Central only'
    dependsOn 'publish'
    doFirst {
        project.ext.set('sonatype', true)
        println "Publishing to Maven Central only"
    }
}

// No new `!!` in the SDK: a force unwrap on a path the app reaches crashes the app instead of failing one call.
// force-unwrap-baseline.txt lists the views that still have them and how many; it may only shrink, and it must
// stay exact, so a removed `!!` or file shows up as a stale line to delete. Plain text scan that skips
// comments, strings and characters (`"https://…"`, `"Hi!!"`), so it needs no compiler and runs in `check`.
tasks.register('checkForceUnwraps') {
    group = 'verification'
    description = 'Fails when the `!!` in the Kotlin sources differ from force-unwrap-baseline.txt.'
    def sourceRoot = file('src/main/kotlin')
    def baseline = file('force-unwrap-baseline.txt')
    def sources = fileTree(sourceRoot) { include '**/*.kt' }
    inputs.files(sources)
    inputs.file(baseline)
    outputs.upToDateWhen { false }
    doLast {
        def allowed = [:]
        baseline.eachLine { line ->
            def entry = line.trim()
            if (entry && !entry.startsWith('#')) {
                def parts = entry.split(/\s+/)
                allowed[parts[0]] = parts[1] as int
            }
        }
        def counts = [:]
        sources.each { File source ->
            def path = sourceRoot.toPath().relativize(source.toPath()).toString().replace(File.separator, '/')
            counts[path] = ForceUnwraps.count(source.getText('UTF-8'))
        }
        def problems = []
        counts.each { path, count ->
            if (!allowed.containsKey(path)) {
                if (count > 0) problems << "${path}: ${count} `!!` in a file the baseline does not list; new code handles the null instead"
            } else {
                int limit = allowed[path] as int
                if (count > limit) problems << "${path}: ${count} `!!`, ${limit} allowed"
                if (count < limit) {
                    def fix = count == 0 ? 'remove its line' : "lower its count to ${count}"
                    problems << "${path}: ${count} `!!`, the baseline still allows ${limit}: ${fix} in force-unwrap-baseline.txt"
                }
            }
        }
        allowed.keySet().findAll { !counts.containsKey(it) }.each { path ->
            problems << "${path}: no such file any more: remove its line from force-unwrap-baseline.txt"
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Force unwraps (`!!`) in the SDK do not match the baseline:\n" + problems.join('\n'))
        }
    }
}

/** Counts `!!` in Kotlin code, skipping comments, string and character literals but not string templates. */
class ForceUnwraps {
    static int count(String text) {
        int count = 0
        int i = 0
        int n = text.length()
        // Frames: [kind, brace depth]. The bottom one is the file's code; a code frame above it is a
        // string template (`${…}`), closed by its own `}`.
        def frames = new ArrayDeque<List>()
        frames.push(['code', 0])
        while (i < n) {
            def frame = frames.peek()
            char c = text.charAt(i)
            switch (frame[0]) {
                case 'code':
                    if (text.startsWith('//', i)) {
                        int end = text.indexOf('\n', i)
                        i = end < 0 ? n : end
                    } else if (text.startsWith('/*', i)) {
                        int depth = 1
                        i += 2
                        while (i < n && depth > 0) {
                            if (text.startsWith('/*', i)) { depth++; i += 2 }
                            else if (text.startsWith('*/', i)) { depth--; i += 2 }
                            else i++
                        }
                    } else if (text.startsWith('"""', i)) {
                        frames.push(['raw', 0]); i += 3
                    } else if (c == '"' as char) {
                        frames.push(['string', 0]); i++
                    } else if (c == '\'' as char) {
                        int from = (i + 1 < n && text.charAt(i + 1) == '\\' as char) ? i + 3 : i + 2
                        int close = text.indexOf("'", Math.min(from, n))
                        i = close < 0 ? n : close + 1
                    } else if (text.startsWith('!!', i)) {
                        count++; i += 2
                    } else if (c == '{' as char) {
                        frame[1]++; i++
                    } else if (c == '}' as char) {
                        if (frame[1] == 0 && frames.size() > 1) frames.pop() else frame[1]--
                        i++
                    } else {
                        i++
                    }
                    break
                case 'string':
                    if (c == '\\' as char) i += 2
                    else if (c == '"' as char || c == '\n' as char) { frames.pop(); i++ }
                    else if (text.startsWith('${', i)) { frames.push(['code', 0]); i += 2 }
                    else i++
                    break
                case 'raw':
                    if (text.startsWith('"""', i)) {
                        i += 3
                        while (i < n && text.charAt(i) == '"' as char) i++
                        frames.pop()
                    } else if (text.startsWith('${', i)) {
                        frames.push(['code', 0]); i += 2
                    } else {
                        i++
                    }
                    break
            }
        }
        return count
    }
}

tasks.named('check') { dependsOn 'checkForceUnwraps' }
