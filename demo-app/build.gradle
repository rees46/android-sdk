plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Apply each provider's plugin only when its config file is present, so the demo still builds
// (with that provider gracefully unavailable) for anyone who hasn't dropped in the real config.
if (file('agconnect-services.json').exists()) {
    apply plugin: 'com.huawei.agconnect'
}
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.personalization.demo'
    compileSdkVersion 34

    flavorDimensions += 'default'

    // Read shop.id from local.properties (check both root and demo-app directories)
    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file('local.properties')
    if (!localPropertiesFile.exists()) {
        localPropertiesFile = project.file('local.properties')
    }
    if (localPropertiesFile.exists()) {
        localProperties.load(new FileInputStream(localPropertiesFile))
    }
    def shopId = localProperties.getProperty('shop.id', '357382bf66ac0ce2f1722677c59511')
    // Server-side shop secret (orders/by_user). Kept out of source — set shop.secret in local.properties.
    def shopSecret = localProperties.getProperty('shop.secret', 'demo-shop-secret')
    // Second shop — powers the "Multi-instance" tab where two shops live at once. Override in
    // local.properties (shop2.id / shop2.secret); the defaults point at a real demo shop.
    def shop2Id = localProperties.getProperty('shop2.id', '4b464e7c386120d4b621bf7cb79293')
    def shop2Secret = localProperties.getProperty('shop2.secret', '60de89fc4c6161ffe92822c679e60321')

    defaultConfig {
        applicationId "com.personalization.demo"
        // Compose requires 21. The SDK keeps minSdk 19 — it takes Compose as compileOnly.
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Add shop ID to BuildConfig
        buildConfigField "String", "SHOP_ID", "\"${shopId}\""
        buildConfigField "String", "SHOP_SECRET", "\"${shopSecret}\""
        buildConfigField "String", "SHOP_ID_2", "\"${shop2Id}\""
        buildConfigField "String", "SHOP_SECRET_2", "\"${shop2Secret}\""
    }

    productFlavors {
        rees46 {
            dimension 'default'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation project(':personalization-sdk')

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Push images are loaded with Glide rather than decoded by hand — see DemoApplication.loadBitmap.
    // The SDK depends on Glide too, but as `implementation`, so it is not on the host's classpath.
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Compose, for the "UI Kit" tab. The SDK exposes StoriesWidget against these APIs but ships
    // none of them, so the demo declares them itself.
    // BOM 2024.12.01 = Compose 1.7.6: the 1.7 line reworked hover-event dispatch and fixes the
    // "The ACTION_HOVER_EXIT event was not cleared" crash in AndroidComposeView that 1.6.8 hit on
    // some OEM devices (Huawei/EMUI). Stays on compileSdk 34 (Compose 1.8 would need compileSdk 35).
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.activity:activity-compose:1.9.0'
    
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    // Huawei — optional, mirrors the SDK. Pulled in only when agconnect-services.json is present
    // (the same gate that applies the agconnect plugin), so the FCM-only build ships no HMS.
    if (file('agconnect-services.json').exists()) {
        implementation 'com.huawei.hms:push:6.11.0.300'
        implementation 'com.huawei.agconnect:agconnect-core:1.9.1.301'
    }

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

